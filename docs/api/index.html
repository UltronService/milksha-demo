<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>迷客夏 POS posReceiver API</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/redoc@2.4.0/bundles/redoc.standalone.css"
    />
    <link rel="stylesheet" href="./redoc-overrides.css" />
  </head>
  <body>
    <div id="redoc-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/redoc@2.4.0/bundles/redoc.standalone.js"></script>
    <script>
      Redoc.init(
        "./openapi.yaml",
        {
          scrollYOffset: 0,
          hideDownloadButton: false,
          expandResponses: "200",
          jsonSampleExpandLevel: 2,
          requiredPropsFirst: true,
          sortPropsAlphabetically: false,
          pathInMiddlePanel: false,
          theme: {
            spacing: {
              unit: 5,
              sectionHorizontal: 40,
            },
            colors: {
              primary: {
                main: "#6b8c2e",
                light: "#88a040",
                dark: "#3d4a1f",
                contrastText: "#ffffff",
              },
              http: {
                get: "#6b8c2e",
                post: "#6b8c2e",
                put: "#6b8c2e",
                options: "#6b8c2e",
                patch: "#6b8c2e",
                delete: "#6b8c2e",
                basic: "#6b8c2e",
                link: "#6b8c2e",
                head: "#6b8c2e",
              },
              text: {
                primary: "#1e293b",
                secondary: "#475569",
              },
              border: {
                dark: "#e2e8f0",
                light: "#f1f5f9",
              },
              responses: {
                success: {
                  color: "#6b8c2e",
                  backgroundColor: "#f4f7ed",
                },
              },
            },
            typography: {
              fontSize: "15px",
              lineHeight: "1.6",
              fontFamily:
                'system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif',
              headings: {
                fontFamily:
                  'system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif',
                fontWeight: "600",
              },
              code: {
                fontSize: "13px",
                fontFamily:
                  'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace',
                wrap: false,
              },
            },
            sidebar: {
              backgroundColor: "#fafafa",
              textColor: "#334155",
              activeTextColor: "#3d4a1f",
              width: "280px",
            },
            rightPanel: {
              backgroundColor: "#1e293b",
              width: "42%",
            },
            codeBlock: {
              backgroundColor: "#0f172a",
            },
          },
        },
        document.getElementById("redoc-container"),
      );
    </script>
  </body>
</html>

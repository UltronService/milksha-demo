  description: |
    ## 對接步驟

    > ⚠️ 測試環境 URL（非正式上線）  
    > 目前文件中的 URL（`https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver`）並非正式環境，僅供上線前測試。  
    > 待測試沒有問題後，會再提供正式環境的 URL。

    > ⚠️ 試點測試安全提醒  
    > 測試用門市帳號可能由迷客夏、POS 廠商或整合方共用；送 Request 前請先確認該門市看板目前沒有他人正在使用的營業內容，避免覆寫他人測試資料。  
    > 文件範例店號如 `c030020`（試點）、`a17`（測試店）等；請勿對未開通叫號的真實門市發送測試 Request。

    1. 開啟叫號看板
       請門市先開啟叫號螢幕（瀏覽器看板）。
       **`account` 即您的門市店號**，與看板 URL 的 `store` 參數相同（例：`c030020`、`a17`）。
       看板網頁在瀏覽器開著且持續向雲端送出心跳時，POS 才會判定為在線；號碼送出後通常幾秒內會出現在畫面上。
       看板 URL 模板：

       `https://ultronservice.github.io/milksha-demo/?mode=cloud&store=<店號>`

       例（測試店）：`https://ultronservice.github.io/milksha-demo/?mode=cloud&store=a17`

       請將看板頁面保持在**前景**（勿最小化視窗、勿切換到其他分頁、勿讓電腦進入睡眠）；否則心跳可能停止，約 **120 秒**後系統會判定看板離線。
       看板約每 **15 秒**送出一筆心跳；關閉看板網頁後，若超過約 **120 秒**未再收到心跳，`posReceiver` 會回「目標叫號機尚未連線」（`isSuccess: false`，號碼不會上板）。
       開啟看板後請等待約 **30 秒**再送 Request，讓心跳先建立連線。

    2. 送第一筆 Request
       - 方法：`POST`
       - URL：

       ```
       https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver
       ```

       - Header：`Content-Type: application/json`
       - `account` 填您的店號（例 `c030020` 或測試店 `a17`）。
       - `serviceSpecialData_Json.target` 填 **前綴** + 店號（見下方「target 規則」）。
       - 外送平台 `source_type` 須與規格完全一致；Uber Eats 為單數 `From_UberEat_Preparing` / `From_UberEat_OK`（不是 `UberEats`）。
       - 每次 Request 的 `number_content` 為看板完整名單（整批覆寫）；多來源混送範例見下方 OpenAPI Request 範例「試點多來源混送」。
       - 同號同來源若已在看板「請取餐」（`*_OK`），再送「準備中」（`*_Preparing`）時看板不退回，仍顯示請取餐；伺服器仍回「資料顯示成功」。
       - `timeStmp` 須為台北時間格式，且與伺服器時間相差在 10 分鐘內（見下方欄位說明）。
       - `serviceSpecialData_Json_Md5Hash` 與 `signature` 為選填，可省略或留空；伺服器不驗證。

       **target 規則（測試環境）**
       - `target` = **前綴** + `account`（店號）；前綴與店號串接後**大小寫須完全一致**。
       - 測試環境接受的前綴：`milksha`、`dotech`（例：店號 `a17` → `milkshaa17` 或 `dotecha17`）。
       - `dotech` 前綴目前僅於測試環境提供；正式環境是否支援將另行公告。

       curl 範例（請先改 `STORE`、`PREFIX`；`timeStmp` 請改成執行當下時間，或使用下方 Python 腳本自動產生）：

       ```bash
       STORE="a17"
       PREFIX="milksha"
       curl -sS -X POST 'https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver' -H 'Content-Type: application/json' -d "{\"isEncrypt\":false,\"serviceSpecialData_Json\":{\"target\":\"${PREFIX}${STORE}\",\"data\":{\"number_content\":[{\"source_type\":\"From_Store_Preparing\",\"number\":\"1234\"},{\"source_type\":\"From_Store_OK\",\"number\":\"5678\"}],\"newsTicker_content\":[],\"newsTickerSpeed\":0}},\"merchant_id\":\"Milksha\",\"account\":\"${STORE}\",\"timeStmp\":\"2026-10-14-15-30-00:0123\"}"
       ```

    3. 檢查 Response
       - HTTP 狀態碼永遠是 200。
       - 外層 `isOK: true` 表示 Request 已被伺服端受理並處理完畢（含驗證失敗）。
       - **`isOK` 不代表號碼已上板**；請以內層 **`isSuccess`** 判斷是否顯示（`true` 才表示已上板）。
       - 將 `information`（或 `reslut.CallingNumberMasterResponse.result`）當 JSON 字串解析。
       - 內層 `isSuccess: true` → 號碼已顯示；`false` → 未顯示，原因在內層 `information` 文字。

    4. 常見錯誤與處理

       下列訊息常見於 `isOK: true` 且內層 `isSuccess: false`（文案不變）。

       | 內層 information | isOK | isSuccess | 建議處理 |
       |------------------|------|-----------|----------|
       | 資料顯示成功 | true | true | 正常；請目視看板是否更新。 |
       | 目標叫號機尚未連線 | true | false | 看板未開或未連線；請先開啟試點看板網址再重送。 |
       | 找不到目標叫號機 | true | false | `account` 在系統中不存在或未建檔；請確認店號是否已開通叫號。 |
       | 叫號資料格式錯誤 | true | false | 整包 JSON、`source_type` 不合法、`timeStmp`，或 `target` 不等於允許的前綴 + `account`（測試環境前綴為 `milksha` 或 `dotech`；打錯亦回此文案，而非「找不到目標叫號機」）；**單筆 `number` 不合規不屬此項**（該筆捨棄，仍可能回「資料顯示成功」，見 `number` 欄）。 |
       | timeStmp 格式錯誤 / timeStmp 已過期 | — | false | 使用台北時間格式；與伺服器時間差勿超過 10 分鐘。 |

    ## 一鍵試打（Python）

    > ⚠️ 測試環境 URL（非正式上線）  
    > 目前文件中的 URL（`https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver`）並非正式環境，僅供上線前測試。  
    > 待測試沒有問題後，會再提供正式環境的 URL。

    > ⚠️ 試點測試安全提醒  
    > 測試用門市帳號可能由迷客夏、POS 廠商或整合方共用；送 Request 前請先確認該門市看板目前沒有他人正在使用的營業內容，避免覆寫他人測試資料。  
    > 文件範例店號如 `c030020`（試點）、`a17`（測試店）等；請勿對未開通叫號的真實門市發送測試 Request。

    若您剛接這支 API，固定 `timeStmp` 的 curl 容易因過期而失敗。  
    下面是一支 Python 3.9+ 腳本（只用標準函式庫），會組好 JSON、自動產生 `timeStmp` 並 POST。

    ### 開始前準備

    1. 確認已安裝 Python 3.9 或更新版（Python：用來跑腳本的程式）。
       - macOS / Linux 終端機：`python3 --version`
       - Windows 命令提示字元或 PowerShell：`py --version`
    2. 若顯示找不到指令，或版本低於 3.9：到 [python.org](https://www.python.org/downloads/) 下載安裝。  
       Windows 安裝時請勾選 Add python.exe to PATH（把 python 加入 PATH 環境變數）。

    ### 操作步驟

    1. 在任意資料夾新增檔案 `pos_receiver_test.py`。
    2. 將下方整段 Python 程式複製貼上（不要只貼一半）。
    3. 打開檔案最上方「只改這裡」區塊：將 `STORE` 改為您的店號（例 `c030020`、`a17`），並選擇測試環境的 `TARGET_PREFIX`（`milksha` 或 `dotech`）。
    4. 開啟終端機，cd 進入 `pos_receiver_test.py` 所在資料夾。
    5. 執行：
       - macOS / Linux：`python3 pos_receiver_test.py`
       - Windows：`py pos_receiver_test.py`

    ```python
    #!/usr/bin/env python3
    # posReceiver 一鍵試打：組 JSON、產生 timeStmp，POST 到測試環境。

    import json
    import sys
    import urllib.error
    import urllib.request
    from datetime import datetime, timedelta, timezone
    from typing import Any, Dict, Optional, Tuple

    # ========== 只改這裡 ==========
    STORE = "a17"  # 您的店號（account）；例 c030020、a17
    TARGET_PREFIX = "milksha"  # 測試環境：milksha 或 dotech（大小寫須一致）
    MERCHANT_ID = "Milksha"
    # 以下為測試環境 URL，非正式上線；正式 URL 待測試通過後由迷客夏另行提供。
    POS_RECEIVER_URL = (
        "https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver"
    )
    # ==============================

    TAIPEI = timezone(timedelta(hours=8))


    def format_time_stmp(now: Optional[datetime] = None) -> str:
        # 伺服器只接受「現在」附近 10 分鐘內的 timeStmp，不可用 curl 範例裡的固定時間。
        if now is None:
            now = datetime.now(timezone.utc)
        elif now.tzinfo is None:
            now = now.replace(tzinfo=timezone.utc)
        local = now.astimezone(TAIPEI)
        ms4 = str(int(now.timestamp() * 1000) % 1000).zfill(4)
        return (
            f"{local.year:04d}-{local.month:02d}-{local.day:02d}-"
            f"{local.hour:02d}-{local.minute:02d}-{local.second:02d}:{ms4}"
        )


    def build_payload(store: str, target_prefix: str, time_stmp: str) -> Dict[str, Any]:
        # target = 前綴 + 店號；若 target 與 account 對不上，API 回「叫號資料格式錯誤」（非「找不到目標叫號機」）。
        return {
            "isEncrypt": False,
            "serviceSpecialData_Json": {
                "target": target_prefix + store,
                "data": {
                    "number_content": [
                        {"source_type": "From_Store_Preparing", "number": "1234"},
                        {"source_type": "From_Store_OK", "number": "5678"},
                    ],
                    "newsTicker_content": [],
                    "newsTickerSpeed": 0,
                },
            },
            "merchant_id": MERCHANT_ID,
            "account": store,
            "timeStmp": time_stmp,
        }


    def post_json(url: str, body_text: str) -> Tuple[int, str]:
        req = urllib.request.Request(
            url,
            data=body_text.encode("utf-8"),
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        try:
            with urllib.request.urlopen(req, timeout=60) as resp:
                return resp.status, resp.read().decode("utf-8")
        except urllib.error.HTTPError as exc:
            body = exc.read().decode("utf-8", errors="replace")
            return exc.code, body


    def main() -> int:
        print("=== posReceiver 一鍵試打 ===")
        print(f"[1/3] 店號 account → {STORE}；target 前綴 → {TARGET_PREFIX}")

        time_stmp = format_time_stmp()
        print(f"[2/3] timeStmp（台北時間，10 分鐘內有效）→ {time_stmp}")

        payload = build_payload(STORE, TARGET_PREFIX, time_stmp)
        body_text = json.dumps(payload, ensure_ascii=False)
        print("[2/3] Request JSON →")
        print(body_text)
        print(f"[3/3] POST {POS_RECEIVER_URL}")

        try:
            status, raw = post_json(POS_RECEIVER_URL, body_text)
        except urllib.error.URLError as exc:
            print("HTTP 狀態: （連線失敗）")
            print(f"錯誤: {exc.reason}")
            return 1

        print(f"HTTP 狀態: {status}")
        print("外層 Response 原文:")
        print(raw)

        try:
            outer = json.loads(raw)
        except json.JSONDecodeError:
            print("無法解析外層 JSON。")
            return 1

        is_ok = outer.get("isOK")
        print(f"外層 isOK → {is_ok}")

        info_raw = outer.get("information", "")
        try:
            inner = json.loads(info_raw) if isinstance(info_raw, str) else info_raw
        except json.JSONDecodeError:
            print(f"information 不是 JSON 字串 → {info_raw!r}")
            return 1 if not is_ok else 0

        is_success = inner.get("isSuccess")
        info_msg = inner.get("information", "")
        print(f"內層 isSuccess → {is_success}")
        print(f"內層 information → {info_msg}")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
    ```

    ### 成功時你會看到（範例）

    是否上板請看內層 **`isSuccess`**：`true` 且 information 為「資料顯示成功」表示已上板；`false` 且為「目標叫號機尚未連線」表示**未上板**（看板未連線）。

    ```
    === posReceiver 一鍵試打 ===
    [1/3] 店號 account → a17；target 前綴 → milksha
    [2/3] timeStmp（台北時間，10 分鐘內有效）→ 2026-10-15-10-06-07:0365
    [2/3] Request JSON →
    {"isEncrypt": false, "serviceSpecialData_Json": {"target": "milkshaa17", ...}, ...}
    [3/3] POST https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver
    HTTP 狀態: 200
    外層 isOK → True
    內層 isSuccess → True
    內層 information → 資料顯示成功
    ```

    若內層 `isSuccess: true`（「資料顯示成功」），可到看板 URL 目視確認號碼是否更新：  
    `https://ultronservice.github.io/milksha-demo/?mode=cloud&store=<店號>`（例 `store=a17`）

    ### 出錯怎麼辦

    先看終端機最後幾行的內層 information（或外層 `information` 解 JSON 後的 `information` 欄位）。  
    HTTP 狀態碼通常仍為 200。

    | 錯誤訊息 | 常見原因 | 怎麼改 |
    |----------|----------|--------|
    | timeStmp 格式錯誤 | 時間字串不符合 `YYYY-MM-DD-HH-mm-ss:XXXX`。 | 用腳本自動產生；勿複製舊範例時間。 |
    | timeStmp 已過期 | 時間與伺服器相差超過 10 分鐘。 | 重新執行腳本產生新時間。 |
    | 找不到目標叫號機 | `account` 在系統中不存在或未建檔。 | 確認 `STORE` 店號已開通叫號。 |
    | 目標叫號機尚未連線 | 看板未開、未連線，或頁面不在前景導致心跳停止。 | 開啟看板 URL、保持頁面在前景、等待約 30 秒後重跑；內層 `isSuccess` 為 `false`，號碼未上板。 |
    | 叫號資料格式錯誤 | 整包 JSON、`source_type` 不合法、`timeStmp`，或 `target` 不等於允許的前綴 + `account`。 | 確認 `target` 為 `{TARGET_PREFIX}{STORE}`（測試環境前綴 `milksha` 或 `dotech`）；對照 OpenAPI 範例。**單筆號碼不合規**通常仍回「資料顯示成功」（該筆不上板），見 `number` 欄。 |
    | 終端機：`python3` / `py` 找不到 | 未安裝 Python 或未加入 PATH。 | 安裝 Python 3.9+ 並重開終端機。 |
    | `URLError` / SSL / 連線逾時 | 公司防火牆、無網路、DNS 問題。 | 換網路或請 IT 放行 `*.cloudfunctions.net`。 |

    - 跑法：`python3 pos_receiver_test.py`（Windows 可用 `py pos_receiver_test.py`）。
    - 成功上板：外層 `isOK: true`，且內層 **`isSuccess: true`** 並顯示「資料顯示成功」；再到看板 URL 目視確認。
    - 整批覆寫：每次送出的 `number_content` 就是看板上的完整名單；`number_content: []` 會清空看板。

    ---

    達鈦 POS 向測試環境推送整批叫號名單的 HTTP API。

    整批覆寫：每次 Request 的 `number_content` 為該門市看板上的完整名單。  
    未出現在本批的號碼會從看板移除。  
    `number_content: []` 表示清空。

    店號與 target：`account` 為門市店號；`target` = 前綴 + `account`（測試環境前綴 `milksha` 或 `dotech`，例 `milkshaa17`、`dotecha17`）。

    選填欄位：`serviceSpecialData_Json_Md5Hash` 與 `signature` 可省略或留空；伺服器不驗證。

    ## 訂單來源與 `source_type` 前綴

    看板依 `source_type` **完整字串**判斷來源與狀態（`*_Preparing`＝準備中，`*_OK`＝可取餐）。下表為五種來源在 API 與看板上的對照與號碼格式（v1.4.6）：

    | 來源名稱（看板） | `source_type` 前綴 | 號碼格式（`number` 字串） | 看板來源圖示 |
    |------------------|--------------------|---------------------------|--------------|
    | 門市 | `From_Store_` | 恰好 4 位數字（例 `1488`） | 無 |
    | 你訂 | `From_milksha_point_` | 恰好 3 位數字；保留前導 0（例 `091`） | 有（你訂） |
    | Uber Eats | `From_UberEat_` | 恰好 5 位十六進位 `0-9A-F`；顯示為大寫（例 `C7458`） | 有 |
    | foodpanda | `From_FoodPanda_` | `#` 加恰好 4 位數字（例 `#6407`） | 有 |
    | Udd | `From_Udd_` | 同門市：恰好 4 位數字（例 `1502`） | 無 |

    圖示僅提供你訂、Uber Eats、foodpanda 三種；門市與 Udd 僅顯示號碼，不顯示平台圖示（設計如此）。

    ## 變更紀錄

    **v1.4.6**
    - `account` 說明為門市店號；看板 URL 改為 `store=<店號>` 模板（例 `a17`）。
    - `target` 規則：前綴 + `account`；測試環境接受 `milksha`、`dotech`（大小寫敏感）；`dotech` 目前僅測試環境。
    - 釐清「目標叫號機尚未連線」為 `isSuccess: false`（未上板）；curl／Python 範例改為可替換店號與前綴。
    - 補上看板須保持前景、開板後約 30 秒再送號、心跳離線約 120 秒等操作提醒。

    **v1.4.5**
    - 補上五來源名稱、`source_type` 前綴與號碼格式對照表；說明你訂為 `From_milksha_point_`。
    - `timeStmp`：未來時間容忍度改為與過期相同，皆為與伺服器相差 **10 分鐘（600 秒）** 內（實測 `milksha-qms-dev`）。
    - 補上看板心跳（約 15 秒）與 `posReceiver` 離線判定（約 120 秒無心跳）說明。
    - 試點安全提醒改為共用測試門市之通用文案。

    **v1.4.4**
    - **Udd 號碼規則**：改與門市相同，為恰好 4 位數字（`0-9`）；例 `1502`。v1.4.3 文件曾列為同 Uber Eats 之 5 位十六進位，已不再適用。
    - 不合規 Udd 單筆仍**捨棄、不上板**；同一次 Request 內其餘合規號碼照常顯示，回應仍為「資料顯示成功」。

    **v1.4.3**
    - 釐清五來源號碼格式；單筆 `number` 不合規時捨棄該筆，整包仍可能回「資料顯示成功」。

    **v1.4.2**
    - 一鍵試打（Python）段落錯誤對照表用語修正。

    [下載 OpenAPI 規格（openapi.yaml）](./openapi.yaml)

servers:
  - url: https://asia-east1-milksha-qms-dev.cloudfunctions.net
    description: 測試環境

security: []

paths:
  /posReceiver:
    post:
      tags:
        - posReceiver
      operationId: posReceiver
      summary: 推送整批叫號資料到指定門市看板
      description: |
        - HTTP 狀態碼一律為 200（含驗證失敗）。
        - `isOK: true`：Request 已處理完畢；內層 **`isSuccess`** 才表示號碼是否顯示。
        - 「找不到目標叫號機」「目標叫號機尚未連線」「叫號資料格式錯誤」皆為 `isOK: true` + `isSuccess: false`（尚未連線時號碼不會上板）。
        - `target` 必須等於允許的前綴 + `account`（測試環境前綴 `milksha` 或 `dotech`，大小寫須一致；例 `milkshaa17`）。
        - `serviceSpecialData_Json_Md5Hash` 與 `signature` 為選填，可省略或留空；伺服器不驗證。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReceiverRequest"
            examples:
              pilotFirstSend:
                summary: 試點門市首送（一準備中、一可取餐）
                value:
                  isEncrypt: false
                  serviceSpecialData_Json:
                    target: milkshac030020
                    data:
                      number_content:
                        - source_type: From_Store_Preparing
                          number: "1234"
                        - source_type: From_Store_OK
                          number: "5678"
                      newsTicker_content: []
                      newsTickerSpeed: 0
                  merchant_id: Milksha
                  account: c030020
                  timeStmp: "2026-10-14-15-30-00:0123"
              mixedSourcesPilot:
                summary: 試點多來源混送（整批名單範例）
                description: |
                  每次 POST 須送出看板上的完整 `number_content`（整批覆寫）；
                  未出現在本批的號碼會從看板移除。以下為試點 `c030020` 欄位格式參考。
                value:
                  isEncrypt: false
                  serviceSpecialData_Json:
                    target: milkshac030020
                    data:
                      number_content:
                        - source_type: From_Store_OK
                          number: "1234"
                        - source_type: From_UberEat_OK
                          number: "C7458"
                        - source_type: From_FoodPanda_OK
                          number: "#6407"
                        - source_type: From_milksha_point_Preparing
                          number: "091"
                        - source_type: From_Udd_OK
                          number: "1502"
                      newsTicker_content: []
                      newsTickerSpeed: 0
                  merchant_id: Milksha
                  account: c030020
                  timeStmp: "2026-10-14-15-32-00:0789"
              clearBoard:
                summary: 清空看板
                value:
                  isEncrypt: false
                  serviceSpecialData_Json:
                    target: milkshac030020
                    data:
                      number_content: []
                      newsTicker_content: []
                      newsTickerSpeed: 0
                  merchant_id: Milksha
                  account: c030020
                  timeStmp: "2026-10-14-15-31-00:0456"
      responses:
        "200":
          description: 永遠回 200；業務成敗看 body。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReceiverResponse"
              examples:
                displaySuccess:
                  summary: 成功寫入看板
                  value:
                    merchant_id: Milksha
                    account: c030020
                    isOK: true
                    information: '{"isSuccess":true,"information":"資料顯示成功"}'
                    reslut:
                      CallingNumberMasterResponse:
                        result: '{"isSuccess":true,"information":"資料顯示成功"}'
                        statusCode: "200"
                    resultMd5: "<hex>"
                    reesultMd5_ServerSignature: "<server signature>"
                    isEncrypted: false
                targetNotFound:
                  summary: 找不到目標叫號機
                  value:
                    merchant_id: Milksha
                    account: c030020
                    isOK: true
                    information: '{"isSuccess":false,"information":"找不到目標叫號機"}'
                    reslut:
                      CallingNumberMasterResponse:
                        result: '{"isSuccess":false,"information":"找不到目標叫號機"}'
                        statusCode: "200"
                    resultMd5: "<hex>"
                    reesultMd5_ServerSignature: "<server signature>"
                    isEncrypted: false
                boxOffline:
                  summary: 看板未連線
                  value:
                    merchant_id: Milksha
                    account: c030020
                    isOK: true
                    information: '{"isSuccess":false,"information":"目標叫號機尚未連線"}'
                    reslut:
                      CallingNumberMasterResponse:
                        result: '{"isSuccess":false,"information":"目標叫號機尚未連線"}'
                        statusCode: "200"
                    resultMd5: "<hex>"
                    reesultMd5_ServerSignature: "<server signature>"
                    isEncrypted: false
                formatError:
                  summary: 驗證失敗（常見外包裝）
                  value:
                    merchant_id: Milksha
                    account: c030020
                    isOK: true
                    information: '{"isSuccess":false,"information":"叫號資料格式錯誤"}'
                    reslut:
                      CallingNumberMasterResponse:
                        result: '{"isSuccess":false,"information":"叫號資料格式錯誤"}'
                        statusCode: "200"
                    resultMd5: "<hex>"
                    reesultMd5_ServerSignature: "<server signature>"
                    isEncrypted: false

components:
  schemas:
    PosReceiverRequest:
      type: object
      required:
        - serviceSpecialData_Json
        - merchant_id
        - account
        - timeStmp
      properties:
        isEncrypt:
          type: boolean
          description: 是否加密；目前固定 `false`。
          example: false
        serviceSpecialData_Json:
          $ref: "#/components/schemas/ServiceSpecialDataJson"
        merchant_id:
          type: string
          description: 商戶代碼；測試環境送 `Milksha`。
          example: Milksha
        account:
          type: string
          description: 門市帳號（店號），與看板 URL 的 `store` 相同。例 `c030020`（試點）、`a17`（測試店）。
          example: a17
        timeStmp:
          type: string
          description: |
            台北時間戳：`YYYY-MM-DD-HH-mm-ss:XXXX`。
            冒號後為毫秒，左側補 0 至 4 位（0–999 有效；1–4 位數字，值 0–9999，>999 時毫秒取 mod 1000）。
            與伺服器時間相差須在 **10 分鐘（600 秒）** 內；過舊或過新（含未來時間）超出此範圍時拒絕（常見內層訊息為「叫號資料格式錯誤」或「timeStmp 已過期」）。
          example: "2026-10-14-15-30-00:0123"
        serviceSpecialData_Json_Md5Hash:
          type: string
          description: |
            選填。可省略或留空；伺服器不驗證此欄位。
            若仍帶值，可為 `serviceSpecialData_Json` 的 UTF-8 MD5 十六進位小寫（相容舊版 POS 格式）。
          example: ""
        signature:
          type: string
          description: |
            選填。可省略或留空；伺服器不驗證此欄位。
          example: ""

    ServiceSpecialDataJson:
      type: object
      required:
        - target
        - data
      properties:
        target:
          type: string
          description: |
            目標叫號機；必須等於 **前綴** + `account`（大小寫須完全一致）。
            測試環境接受的前綴：`milksha`、`dotech`（例店號 `a17` → `milkshaa17` 或 `dotecha17`）。
            `dotech` 目前僅測試環境；正式環境將另行公告。
          example: milkshaa17
        data:
          type: object
          required:
            - number_content
          properties:
            number_content:
              type: array
              description: |
                整批叫號清單（全量覆寫）。
                同號同來源已由 `*_OK` 顯示在「請取餐」後，再送 `*_Preparing` 不會退回準備中；伺服器仍回「資料顯示成功」。
              items:
                $ref: "#/components/schemas/NumberContentItem"
            newsTicker_content:
              type: array
              items:
                type: string
              description: 跑馬燈；可送 `[]`。
            newsTickerSpeed:
              type: number
              description: 跑馬燈速度；可送 `0`。
              example: 0

    NumberContentItem:
      type: object
      required:
        - source_type
        - number
      properties:
        source_type:
          type: string
          description: |
            訂單來源＋狀態，完整字串比對。共 10 種（五來源 × 準備中／可取餐）：
            `From_Store_Preparing` / `From_Store_OK`（門市）、
            `From_milksha_point_Preparing` / `From_milksha_point_OK`（**你訂**）、
            `From_FoodPanda_Preparing` / `From_FoodPanda_OK`（foodpanda）、
            `From_UberEat_Preparing` / `From_UberEat_OK`（Uber Eats）、
            `From_Udd_Preparing` / `From_Udd_OK`（Udd）。
            `*_Preparing` → 準備中；`*_OK` → 可取餐（請取餐）。
            同號同來源已為 `*_OK` 時，再送 `*_Preparing` 看板維持請取餐，不回退。
            來源名稱、前綴與號碼格式見文件開頭「訂單來源與 source_type 前綴」表。
          example: From_Store_OK
        number:
          type: string
          description: |
            顯示號碼，必須為 JSON 字串（不可送數字型別）。

            五來源號碼規則（v1.4.4）：
            - 門市：恰好 4 位數字（例 `1488`）。
            - 迷點：恰好 3 位數字；保留前導 0（例 `007`、`091`）。
            - Uber Eats：恰好 5 位十六進位字元 `0-9A-F`；儲存與顯示為大寫（例 `BFBEF`；送 `bfbef` 亦視為 `BFBEF`）。
            - foodpanda：必須為 `#` 加恰好 4 位數字；`#` 保留顯示（例 `#6405`；不可只送 `6405`）。
            - Udd：同門市（恰好 4 位數字 `0-9`；例 `1502`）。舊版 5 位十六進位或英數格式不再接受。
            - 看板圖示：僅你訂、Uber Eats、foodpanda 顯示平台圖示；門市與 Udd 不顯示圖示。
            - 同一 `source_type` + 同一正規化號碼只保留一筆（Uber Eats 例：同來源重送 `BFBEF` 與 `bfbef` 視為重複）；不同來源可同號並存。

            **不合規單筆號碼：**  
            `number_content` 中某一筆 `number` 不符上列規則時，**該筆捨棄、不上板**；同一次 Request 內其餘合規號碼仍照常顯示。  
            此情境下回應仍為 HTTP **200**、外層 **`isOK: true`**、內層 **`isSuccess: true`**、訊息 **「資料顯示成功」**（**不**會因混送不合規號碼而改回「叫號資料格式錯誤」或 `isSuccess: false`）。
          example: "007"

    PosReceiverResponse:
      type: object
      properties:
        merchant_id:
          type: string
          example: Milksha
        account:
          type: string
          example: c030020
        isOK:
          type: boolean
          description: |
            Request 是否已被伺服端受理並處理完畢。
            常為 `true`（含「找不到目標叫號機」「尚未連線」「格式錯誤」）。
            是否上板請看內層 JSON 的 `isSuccess`。
        information:
          type: string
          description: JSON 字串；解析後含 `isSuccess` 與 `information`。
        reslut:
          type: object
          description: 拼字固定為 `reslut`，不可改。
          properties:
            CallingNumberMasterResponse:
              type: object
              properties:
                result:
                  type: string
                  description: 與 `information` 相同結構的 JSON 字串。
                statusCode:
                  type: string
                  example: "200"
        resultMd5:
          type: string
          description: 相容欄位；伺服器可能回傳，客戶端無須驗證或使用。
        reesultMd5_ServerSignature:
          type: string
          description: |
            相容欄位；拼字固定為 `reesultMd5_ServerSignature`。
            伺服器可能回傳，客戶端無須驗證或使用。
        isEncrypted:
          type: boolean

tags:
  - name: posReceiver
    description: POS 整批推送

x-tagGroups:
  - name: 叫號推送
    tags:
      - posReceiver

x-response-messages:
  description: |
    ## 內層 information 訊息

    外層 `isOK: true` = Request 已處理完畢。  
    內層 `isSuccess` = 號碼是否已顯示。

    | information | 外層 isOK | 內層 isSuccess | 時機 |
    |-------------|-----------|----------------|------|
    | 資料顯示成功 | true | true | 看板在線且 Request 已受理；合規號碼已更新顯示（不合規單筆號碼已捨棄不上板，仍回此訊息）。 |
    | 目標叫號機尚未連線 | true | false | 驗證通過，看板未連線；不更新畫面。 |
    | 找不到目標叫號機 | true | false | `account` 在系統中不存在或未建檔。 |
    | 叫號資料格式錯誤 | true | false | 整包 Request 結構或必填欄位錯誤、`source_type` 不合法、timeStmp 等整包驗證失敗，或 `target` 不等於允許的前綴 + `account`（測試環境前綴 `milksha` 或 `dotech`；**單筆 `number` 不合規不屬此項**，見 `number` 欄）。 |
    | timeStmp 格式錯誤 | — | false | timeStmp 格式不符。 |
    | timeStmp 已過期 | — | false | 與伺服器時間差過大。 |
    | 入口 A 未啟用 | — | false | 接收端暫停此入口。 |

    判讀順序：HTTP 200 → 外層 isOK（已處理）→ 解析 JSON 字串 → **內層 isSuccess（是否上板，以此為準）** + information。

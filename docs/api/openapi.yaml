openapi: 3.0.3
info:
  title: 迷客夏 POS 叫號推送 API（posReceiver）
  version: "1.4.3"
  license:
    name: Proprietary
    url: https://ultronservice.github.io/milksha-demo/docs/api/
  x-logo:
    url: assets/logo.svg
    altText: 迷客夏 Milksha
    href: https://ultronservice.github.io/milksha-demo/
    backgroundColor: "#fafafa"
  description: |
    ## 對接步驟

    > ⚠️ 測試環境 URL（非正式上線）  
    > 目前文件中的 URL（`https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver`）並非正式環境，僅供上線前測試。  
    > 待測試沒有問題後，會再提供正式環境的 URL。

    > ⚠️ 試點測試安全提醒  
    > 送 Request 前，請先確認試點看板目前沒有正在使用的營業內容。  
    > 測試請僅使用店號 `c030020`；請勿對其他真實門市發送測試 Request。

    1. 開啟試點看板
       請門市先開啟叫號螢幕（瀏覽器看板）。
       看板網頁在瀏覽器開著即視為在線；號碼送出後通常幾秒內會出現在畫面上。
       試點門市 `c030020` 看板網址：

       `https://ultronservice.github.io/milksha-demo/?mode=cloud&store=c030020`

    2. 送第一筆 Request
       - 方法：`POST`
       - URL：

       ```
       https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver
       ```

       - Header：`Content-Type: application/json`
       - `account` 填 `c030020`。
       - `serviceSpecialData_Json.target` 填 `milkshac030020`（=`milksha` + 店號）。
       - 外送平台 `source_type` 須與規格完全一致；Uber Eats 為單數 `From_UberEat_Preparing` / `From_UberEat_OK`（不是 `UberEats`）。
       - 每次 Request 的 `number_content` 為看板完整名單（整批覆寫）；多來源混送範例見下方 OpenAPI Request 範例「試點多來源混送」。
       - 同號同來源若已在看板「請取餐」（`*_OK`），再送「準備中」（`*_Preparing`）時看板不退回，仍顯示請取餐；伺服器仍回「資料顯示成功」。
       - `timeStmp` 須為台北時間格式，且與伺服器時間相差在 10 分鐘內（見下方欄位說明）。
       - `serviceSpecialData_Json_Md5Hash` 與 `signature` 為選填，可省略或留空；伺服器不驗證。

       curl 範例（`timeStmp` 請改成執行當下時間，或使用下方 Python 腳本自動產生）：

       ```bash
       curl -sS -X POST 'https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver' -H 'Content-Type: application/json' -d '{"isEncrypt":false,"serviceSpecialData_Json":{"target":"milkshac030020","data":{"number_content":[{"source_type":"From_Store_Preparing","number":"1234"},{"source_type":"From_Store_OK","number":"5678"}],"newsTicker_content":[],"newsTickerSpeed":0}},"merchant_id":"Milksha","account":"c030020","timeStmp":"2026-10-14-15-30-00:0123"}'
       ```

    3. 檢查 Response
       - HTTP 狀態碼永遠是 200。
       - 外層 `isOK: true` 表示 Request 已被伺服端受理並處理完畢（含驗證失敗）。
       - `isOK` 不代表號碼已上板；是否顯示請看內層 `isSuccess`。
       - 將 `information`（或 `reslut.CallingNumberMasterResponse.result`）當 JSON 字串解析。
       - 內層 `isSuccess: true` → 號碼已顯示；`false` → 未顯示，原因在內層 `information` 文字。

    4. 常見錯誤與處理

       下列訊息常見於 `isOK: true` 且內層 `isSuccess: false`（文案不變）。

       | 內層 information | isOK | isSuccess | 建議處理 |
       |------------------|------|-----------|----------|
       | 資料顯示成功 | true | true | 正常；請目視看板是否更新。 |
       | 目標叫號機尚未連線 | true | false | 看板未開或未連線；請先開啟試點看板網址再重送。 |
       | 找不到目標叫號機 | true | false | `account` 在系統中不存在或未建檔；請確認店號是否已開通叫號（試點為 `c030020`）。 |
       | 叫號資料格式錯誤 | true | false | JSON、`source_type`、號碼規則、`timeStmp`，或 `target` 不等於 `milksha` + `account`（例打錯 target 亦回此文案，而非「找不到目標叫號機」）。 |
       | timeStmp 格式錯誤 / timeStmp 已過期 | — | false | 使用台北時間格式；與伺服器時間差勿超過 10 分鐘。 |

    ## 一鍵試打（Python）

    > ⚠️ 測試環境 URL（非正式上線）  
    > 目前文件中的 URL（`https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver`）並非正式環境，僅供上線前測試。  
    > 待測試沒有問題後，會再提供正式環境的 URL。

    > ⚠️ 試點測試安全提醒  
    > 送 Request 前，請先確認試點看板目前沒有正在使用的營業內容。  
    > 測試請僅使用店號 `c030020`；請勿對其他真實門市發送測試 Request。

    若您剛接這支 API，固定 `timeStmp` 的 curl 容易因過期而失敗。  
    下面是一支 Python 3.9+ 腳本（只用標準函式庫），會組好 JSON、自動產生 `timeStmp` 並 POST。

    ### 開始前準備

    1. 確認已安裝 Python 3.9 或更新版（Python：用來跑腳本的程式）。
       - macOS / Linux 終端機：`python3 --version`
       - Windows 命令提示字元或 PowerShell：`py --version`
    2. 若顯示找不到指令，或版本低於 3.9：到 [python.org](https://www.python.org/downloads/) 下載安裝。  
       Windows 安裝時請勾選 Add python.exe to PATH（把 python 加入 PATH 環境變數）。

    ### 操作步驟

    1. 在任意資料夾新增檔案 `pos_receiver_test.py`。
    2. 將下方整段 Python 程式複製貼上（不要只貼一半）。
    3. 打開檔案最上方「只改這裡」區塊。試點測試請維持 `STORE = "c030020"`，勿改為其他門市店號。
    4. 開啟終端機，cd 進入 `pos_receiver_test.py` 所在資料夾。
    5. 執行：
       - macOS / Linux：`python3 pos_receiver_test.py`
       - Windows：`py pos_receiver_test.py`

    ```python
    #!/usr/bin/env python3
    # posReceiver 一鍵試打：組 JSON、產生 timeStmp，POST 到測試環境。

    import json
    import sys
    import urllib.error
    import urllib.request
    from datetime import datetime, timedelta, timezone
    from typing import Any, Dict, Optional, Tuple

    # ========== 只改這裡 ==========
    STORE = "c030020"  # 試點店號（account）；請勿對其他真實門市發送測試資料
    MERCHANT_ID = "Milksha"
    # 以下為測試環境 URL，非正式上線；正式 URL 待測試通過後由迷客夏另行提供。
    POS_RECEIVER_URL = (
        "https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver"
    )
    # ==============================

    TAIPEI = timezone(timedelta(hours=8))


    def format_time_stmp(now: Optional[datetime] = None) -> str:
        # 伺服器只接受「現在」附近 10 分鐘內的 timeStmp，不可用 curl 範例裡的固定時間。
        if now is None:
            now = datetime.now(timezone.utc)
        elif now.tzinfo is None:
            now = now.replace(tzinfo=timezone.utc)
        local = now.astimezone(TAIPEI)
        ms4 = str(int(now.timestamp() * 1000) % 1000).zfill(4)
        return (
            f"{local.year:04d}-{local.month:02d}-{local.day:02d}-"
            f"{local.hour:02d}-{local.minute:02d}-{local.second:02d}:{ms4}"
        )


    def build_payload(store: str, time_stmp: str) -> Dict[str, Any]:
        # target = "milksha" + 店號；若 target 與 account 對不上，API 回「叫號資料格式錯誤」（非「找不到目標叫號機」）。
        return {
            "isEncrypt": False,
            "serviceSpecialData_Json": {
                "target": "milksha" + store,
                "data": {
                    "number_content": [
                        {"source_type": "From_Store_Preparing", "number": "1234"},
                        {"source_type": "From_Store_OK", "number": "5678"},
                    ],
                    "newsTicker_content": [],
                    "newsTickerSpeed": 0,
                },
            },
            "merchant_id": MERCHANT_ID,
            "account": store,
            "timeStmp": time_stmp,
        }


    def post_json(url: str, body_text: str) -> Tuple[int, str]:
        req = urllib.request.Request(
            url,
            data=body_text.encode("utf-8"),
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        try:
            with urllib.request.urlopen(req, timeout=60) as resp:
                return resp.status, resp.read().decode("utf-8")
        except urllib.error.HTTPError as exc:
            body = exc.read().decode("utf-8", errors="replace")
            return exc.code, body


    def main() -> int:
        print("=== posReceiver 一鍵試打 ===")
        print(f"[1/3] 店號 account / target 前綴 milksha → {STORE}")

        time_stmp = format_time_stmp()
        print(f"[2/3] timeStmp（台北時間，10 分鐘內有效）→ {time_stmp}")

        payload = build_payload(STORE, time_stmp)
        body_text = json.dumps(payload, ensure_ascii=False)
        print("[2/3] Request JSON →")
        print(body_text)
        print(f"[3/3] POST {POS_RECEIVER_URL}")

        try:
            status, raw = post_json(POS_RECEIVER_URL, body_text)
        except urllib.error.URLError as exc:
            print("HTTP 狀態: （連線失敗）")
            print(f"錯誤: {exc.reason}")
            return 1

        print(f"HTTP 狀態: {status}")
        print("外層 Response 原文:")
        print(raw)

        try:
            outer = json.loads(raw)
        except json.JSONDecodeError:
            print("無法解析外層 JSON。")
            return 1

        is_ok = outer.get("isOK")
        print(f"外層 isOK → {is_ok}")

        info_raw = outer.get("information", "")
        try:
            inner = json.loads(info_raw) if isinstance(info_raw, str) else info_raw
        except json.JSONDecodeError:
            print(f"information 不是 JSON 字串 → {info_raw!r}")
            return 1 if not is_ok else 0

        is_success = inner.get("isSuccess")
        info_msg = inner.get("information", "")
        print(f"內層 isSuccess → {is_success}")
        print(f"內層 information → {info_msg}")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
    ```

    ### 成功時你會看到（範例）

    內層 `information` 可能是「資料顯示成功」或「目標叫號機尚未連線」（看板沒開時）；兩者都代表 Request 已被伺服器接受。

    ```
    === posReceiver 一鍵試打 ===
    [1/3] 店號 account / target 前綴 milksha → c030020
    [2/3] timeStmp（台北時間，10 分鐘內有效）→ 2026-10-15-10-06-07:0365
    [2/3] Request JSON →
    {"isEncrypt": false, "serviceSpecialData_Json": {"target": "milkshac030020", ...}, ...}
    [3/3] POST https://asia-east1-milksha-qms-dev.cloudfunctions.net/posReceiver
    HTTP 狀態: 200
    外層 isOK → True
    內層 isSuccess → True
    內層 information → 資料顯示成功
    ```

    若為「資料顯示成功」，可到試點看板網址目視確認號碼是否更新：  
    `https://ultronservice.github.io/milksha-demo/?mode=cloud&store=c030020`

    ### 出錯怎麼辦

    先看終端機最後幾行的內層 information（或外層 `information` 解 JSON 後的 `information` 欄位）。  
    HTTP 狀態碼通常仍為 200。

    | 錯誤訊息 | 常見原因 | 怎麼改 |
    |----------|----------|--------|
    | timeStmp 格式錯誤 | 時間字串不符合 `YYYY-MM-DD-HH-mm-ss:XXXX`。 | 用腳本自動產生；勿複製舊範例時間。 |
    | timeStmp 已過期 | 時間與伺服器相差超過 10 分鐘。 | 重新執行腳本產生新時間。 |
    | 找不到目標叫號機 | `account` 在系統中不存在或未建檔。 | 確認試點 `STORE` 為 `c030020` 且店號已開通叫號。 |
    | 目標叫號機尚未連線 | 看板網頁未開或未連上雲端。 | 先開試點看板 URL 再重跑；不影響「Request 已受理」。 |
    | 叫號資料格式錯誤 | JSON、`source_type`、號碼格式不符，或 `target` 不等於 `milksha` + `account`。 | 確認 `target` 為 `milkshac030020`；對照 OpenAPI 範例，先勿改 `number_content` 測通再改。 |
    | 終端機：`python3` / `py` 找不到 | 未安裝 Python 或未加入 PATH。 | 安裝 Python 3.9+ 並重開終端機。 |
    | `URLError` / SSL / 連線逾時 | 公司防火牆、無網路、DNS 問題。 | 換網路或請 IT 放行 `*.cloudfunctions.net`。 |

    - 跑法：`python3 pos_receiver_test.py`（Windows 可用 `py pos_receiver_test.py`）。
    - 成功：外層 `isOK: true`，且內層 `isSuccess: true` 並顯示「資料顯示成功」（或 `false` +「目標叫號機尚未連線」亦表示已送達伺服器）；再到看板 URL 目視確認。
    - 整批覆寫：每次送出的 `number_content` 就是看板上的完整名單；`number_content: []` 會清空看板。

    ---

    達鈦 POS 向測試環境推送整批叫號名單的 HTTP API。

    整批覆寫：每次 Request 的 `number_content` 為該門市看板上的完整名單。  
    未出現在本批的號碼會從看板移除。  
    `number_content: []` 表示清空。

    試點門市：`account` = `c030020`，`target` = `milkshac030020`。

    選填欄位：`serviceSpecialData_Json_Md5Hash` 與 `signature` 可省略或留空；伺服器不驗證。

    [下載 OpenAPI 規格（openapi.yaml）](./openapi.yaml)

servers:
  - url: https://asia-east1-milksha-qms-dev.cloudfunctions.net
    description: 測試環境

security: []

paths:
  /posReceiver:
    post:
      tags:
        - posReceiver
      operationId: posReceiver
      summary: 推送整批叫號資料到指定門市看板
      description: |
        - HTTP 狀態碼一律為 200（含驗證失敗）。
        - `isOK: true`：Request 已處理完畢；`isSuccess`（內層 JSON）才表示號碼是否顯示。
        - 「找不到目標叫號機」「目標叫號機尚未連線」「叫號資料格式錯誤」皆為 `isOK: true` + `isSuccess: false`。
        - `target` 必須等於 `'milksha' + account`（試點：`milkshac030020`）。
        - `serviceSpecialData_Json_Md5Hash` 與 `signature` 為選填，可省略或留空；伺服器不驗證。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PosReceiverRequest"
            examples:
              pilotFirstSend:
                summary: 試點門市首送（一準備中、一可取餐）
                value:
                  isEncrypt: false
                  serviceSpecialData_Json:
                    target: milkshac030020
                    data:
                      number_content:
                        - source_type: From_Store_Preparing
                          number: "1234"
                        - source_type: From_Store_OK
                          number: "5678"
                      newsTicker_content: []
                      newsTickerSpeed: 0
                  merchant_id: Milksha
                  account: c030020
                  timeStmp: "2026-10-14-15-30-00:0123"
              mixedSourcesPilot:
                summary: 試點多來源混送（整批名單範例）
                description: |
                  每次 POST 須送出看板上的完整 `number_content`（整批覆寫）；
                  未出現在本批的號碼會從看板移除。以下為試點 `c030020` 欄位格式參考。
                value:
                  isEncrypt: false
                  serviceSpecialData_Json:
                    target: milkshac030020
                    data:
                      number_content:
                        - source_type: From_Store_OK
                          number: "1234"
                        - source_type: From_UberEat_OK
                          number: "C7458"
                        - source_type: From_FoodPanda_OK
                          number: "#6407"
                        - source_type: From_milksha_point_Preparing
                          number: "091"
                      newsTicker_content: []
                      newsTickerSpeed: 0
                  merchant_id: Milksha
                  account: c030020
                  timeStmp: "2026-10-14-15-32-00:0789"
              clearBoard:
                summary: 清空看板
                value:
                  isEncrypt: false
                  serviceSpecialData_Json:
                    target: milkshac030020
                    data:
                      number_content: []
                      newsTicker_content: []
                      newsTickerSpeed: 0
                  merchant_id: Milksha
                  account: c030020
                  timeStmp: "2026-10-14-15-31-00:0456"
      responses:
        "200":
          description: 永遠回 200；業務成敗看 body。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosReceiverResponse"
              examples:
                displaySuccess:
                  summary: 成功寫入看板
                  value:
                    merchant_id: Milksha
                    account: c030020
                    isOK: true
                    information: '{"isSuccess":true,"information":"資料顯示成功"}'
                    reslut:
                      CallingNumberMasterResponse:
                        result: '{"isSuccess":true,"information":"資料顯示成功"}'
                        statusCode: "200"
                    resultMd5: "<hex>"
                    reesultMd5_ServerSignature: "<server signature>"
                    isEncrypted: false
                targetNotFound:
                  summary: 找不到目標叫號機
                  value:
                    merchant_id: Milksha
                    account: c030020
                    isOK: true
                    information: '{"isSuccess":false,"information":"找不到目標叫號機"}'
                    reslut:
                      CallingNumberMasterResponse:
                        result: '{"isSuccess":false,"information":"找不到目標叫號機"}'
                        statusCode: "200"
                    resultMd5: "<hex>"
                    reesultMd5_ServerSignature: "<server signature>"
                    isEncrypted: false
                boxOffline:
                  summary: 看板未連線
                  value:
                    merchant_id: Milksha
                    account: c030020
                    isOK: true
                    information: '{"isSuccess":false,"information":"目標叫號機尚未連線"}'
                    reslut:
                      CallingNumberMasterResponse:
                        result: '{"isSuccess":false,"information":"目標叫號機尚未連線"}'
                        statusCode: "200"
                    resultMd5: "<hex>"
                    reesultMd5_ServerSignature: "<server signature>"
                    isEncrypted: false
                formatError:
                  summary: 驗證失敗（常見外包裝）
                  value:
                    merchant_id: Milksha
                    account: c030020
                    isOK: true
                    information: '{"isSuccess":false,"information":"叫號資料格式錯誤"}'
                    reslut:
                      CallingNumberMasterResponse:
                        result: '{"isSuccess":false,"information":"叫號資料格式錯誤"}'
                        statusCode: "200"
                    resultMd5: "<hex>"
                    reesultMd5_ServerSignature: "<server signature>"
                    isEncrypted: false

components:
  schemas:
    PosReceiverRequest:
      type: object
      required:
        - serviceSpecialData_Json
        - merchant_id
        - account
        - timeStmp
      properties:
        isEncrypt:
          type: boolean
          description: 是否加密；目前固定 `false`。
          example: false
        serviceSpecialData_Json:
          $ref: "#/components/schemas/ServiceSpecialDataJson"
        merchant_id:
          type: string
          description: 商戶代碼；測試環境送 `Milksha`。
          example: Milksha
        account:
          type: string
          description: 門市帳號（店號）。試點為 `c030020`。
          example: c030020
        timeStmp:
          type: string
          description: |
            台北時間戳：`YYYY-MM-DD-HH-mm-ss:XXXX`。
            冒號後為毫秒，左側補 0 至 4 位（0–999 有效；1–4 位數字，值 0–9999，>999 時毫秒取 mod 1000）。
            與伺服器時間差超過 10 分鐘拒絕；允許約 60 秒未來時間。
          example: "2026-10-14-15-30-00:0123"
        serviceSpecialData_Json_Md5Hash:
          type: string
          description: |
            選填。可省略或留空；伺服器不驗證此欄位。
            若仍帶值，可為 `serviceSpecialData_Json` 的 UTF-8 MD5 十六進位小寫（相容舊版 POS 格式）。
          example: ""
        signature:
          type: string
          description: |
            選填。可省略或留空；伺服器不驗證此欄位。
          example: ""

    ServiceSpecialDataJson:
      type: object
      required:
        - target
        - data
      properties:
        target:
          type: string
          description: 目標叫號機；必須等於 `milksha` + `account`。
          example: milkshac030020
        data:
          type: object
          required:
            - number_content
          properties:
            number_content:
              type: array
              description: |
                整批叫號清單（全量覆寫）。
                同號同來源已由 `*_OK` 顯示在「請取餐」後，再送 `*_Preparing` 不會退回準備中；伺服器仍回「資料顯示成功」。
              items:
                $ref: "#/components/schemas/NumberContentItem"
            newsTicker_content:
              type: array
              items:
                type: string
              description: 跑馬燈；可送 `[]`。
            newsTickerSpeed:
              type: number
              description: 跑馬燈速度；可送 `0`。
              example: 0

    NumberContentItem:
      type: object
      required:
        - source_type
        - number
      properties:
        source_type:
          type: string
          description: |
            訂單來源＋狀態，完整字串比對。共 10 種：
            `From_Store_Preparing` / `From_Store_OK`、
            `From_milksha_point_Preparing` / `From_milksha_point_OK`、
            `From_FoodPanda_Preparing` / `From_FoodPanda_OK`、
            `From_UberEat_Preparing` / `From_UberEat_OK`、
            `From_Udd_Preparing` / `From_Udd_OK`。
            `*_Preparing` → 準備中；`*_OK` → 可取餐（請取餐）。
            同號同來源已為 `*_OK` 時，再送 `*_Preparing` 看板維持請取餐，不回退。
          example: From_Store_OK
        number:
          type: string
          description: |
            顯示號碼，必須為 JSON 字串（不可送數字型別）。

            五來源號碼規則（v1.4.3）：
            - 門市：恰好 4 位數字（例 `1488`）。
            - 迷點：恰好 3 位數字；保留前導 0（例 `007`、`091`）。
            - Uber Eats：恰好 5 位十六進位字元 `0-9A-F`；儲存與顯示為大寫（例 `BFBEF`；送 `bfbef` 亦視為 `BFBEF`）。
            - foodpanda：必須為 `#` 加恰好 4 位數字；`#` 保留顯示（例 `#6405`；不可只送 `6405`）。
            - Udd：同 Uber Eats（恰好 5 位十六進位大寫）。
            - 同一 `source_type` + 同一正規化號碼只保留一筆（例同來源重送 `DDDDD` 與 `ddddd` 視為重複）；不同來源可同號並存。

            **不合規單筆號碼（雲端已部署實測）：**  
            `number_content` 中某一筆 `number` 不符上列規則時，**該筆捨棄、不上板**；同一次 Request 內其餘合規號碼仍照常顯示。  
            此情境下回應仍為 HTTP **200**、外層 **`isOK: true`**、內層 **`isSuccess: true`**、訊息 **「資料顯示成功」**（**不**會因混送不合規號碼而改回「叫號資料格式錯誤」或 `isSuccess: false`）。
          example: "007"

    PosReceiverResponse:
      type: object
      properties:
        merchant_id:
          type: string
          example: Milksha
        account:
          type: string
          example: c030020
        isOK:
          type: boolean
          description: |
            Request 是否已被伺服端受理並處理完畢。
            常為 `true`（含「找不到目標叫號機」「尚未連線」「格式錯誤」）。
            是否上板請看內層 JSON 的 `isSuccess`。
        information:
          type: string
          description: JSON 字串；解析後含 `isSuccess` 與 `information`。
        reslut:
          type: object
          description: 拼字固定為 `reslut`，不可改。
          properties:
            CallingNumberMasterResponse:
              type: object
              properties:
                result:
                  type: string
                  description: 與 `information` 相同結構的 JSON 字串。
                statusCode:
                  type: string
                  example: "200"
        resultMd5:
          type: string
          description: 相容欄位；伺服器可能回傳，客戶端無須驗證或使用。
        reesultMd5_ServerSignature:
          type: string
          description: |
            相容欄位；拼字固定為 `reesultMd5_ServerSignature`。
            伺服器可能回傳，客戶端無須驗證或使用。
        isEncrypted:
          type: boolean

tags:
  - name: posReceiver
    description: POS 整批推送

x-tagGroups:
  - name: 叫號推送
    tags:
      - posReceiver

x-response-messages:
  description: |
    ## 內層 information 訊息

    外層 `isOK: true` = Request 已處理完畢。  
    內層 `isSuccess` = 號碼是否已顯示。

    | information | 外層 isOK | 內層 isSuccess | 時機 |
    |-------------|-----------|----------------|------|
    | 資料顯示成功 | true | true | 看板在線且 Request 已受理；合規號碼已更新顯示（不合規單筆號碼已捨棄不上板，仍回此訊息）。 |
    | 目標叫號機尚未連線 | true | false | 驗證通過，看板未連線；不更新畫面。 |
    | 找不到目標叫號機 | true | false | `account` 在系統中不存在或未建檔。 |
    | 叫號資料格式錯誤 | true | false | 整包 Request 結構或必填欄位錯誤、`source_type` 不合法、timeStmp 等整包驗證失敗，或 `target` 不等於 `milksha` + `account`（**單筆 `number` 不合規不屬此項**，見 `number` 欄）。 |
    | timeStmp 格式錯誤 | — | false | timeStmp 格式不符。 |
    | timeStmp 已過期 | — | false | 與伺服器時間差過大。 |
    | 入口 A 未啟用 | — | false | 接收端暫停此入口。 |

    判讀順序：HTTP 200 → 外層 isOK（已處理）→ 解析 JSON 字串 → 內層 isSuccess（是否上板）+ information。

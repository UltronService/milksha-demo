<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <base href="../" />
    <meta name="viewport" content="width=5808, height=1136" />
    <title>字級對照</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #2a2a2a;
        font-family: Arial, Arimo, sans-serif;
      }
      .compare-row {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        gap: 24px;
        padding: 0;
      }
      .compare-col {
        width: 1920px;
        flex: none;
      }
      .compare-label {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: 400;
        color: #f5f5f5;
        letter-spacing: 0.04em;
        background: #2a2a2a;
      }
      .compare-col img {
        display: block;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div class="compare-row" id="row"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var raw = params.get('sizes') || '72,68,64';
        var sizes = raw.split(',').map(function (s) {
          return s.trim();
        });
        var row = document.getElementById('row');
        sizes.forEach(function (px) {
          var col = document.createElement('div');
          col.className = 'compare-col';
          var label = document.createElement('div');
          label.className = 'compare-label';
          label.textContent = px + 'px';
          var img = document.createElement('img');
          img.src =
            'mockups/artifacts/source-icons-mockup/source-icons-font-preview-' +
            px +
            'px-1920x1080.png';
          img.alt = px + 'px preview';
          col.appendChild(label);
          col.appendChild(img);
          row.appendChild(col);
        });
      })();
    </script>
  </body>
</html>

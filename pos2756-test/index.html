<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS2756 APK 測試頁</title>
    <style>
      body {
        margin: 8px;
        font-family: ui-monospace, 'Cascadia Mono', 'Consolas', monospace;
        font-size: 14px;
        line-height: 1.35;
      }
      #top-status,
      #bottom-log {
        white-space: pre-wrap;
        word-break: break-all;
      }
      #bottom-log {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid #888;
      }
    </style>
    <script>
      (function () {
        'use strict';
        var pending = [];
        var bridge = {
          onOrder: function (raw) {
            pending.push({ kind: 'order', raw: raw });
          },
          onSoldout: function (raw) {
            pending.push({ kind: 'soldout', raw: raw });
          },
          drainPending: function (handler) {
            var q = pending;
            pending = [];
            for (var i = 0; i < q.length; i++) {
              handler(q[i]);
            }
          },
        };
        window.__pos2756ApkBridge = bridge;
        window.getOrderStatus = function (arg) {
          try {
            bridge.onOrder(arg);
          } catch (_e) {
            /* never throw */
          }
        };
        window.getSoldoutItem = function (arg) {
          try {
            bridge.onSoldout(arg);
          } catch (_e) {
            /* never throw */
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="top-status">載入中…</div>
    <div id="bottom-log"></div>
    <script src="pos2756-test-core.js?v=20261017a"></script>
    <script src="pos2756-test-page.js?v=20261017a"></script>
  </body>
</html>

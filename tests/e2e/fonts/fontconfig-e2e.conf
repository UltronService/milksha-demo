<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- E2E only: minimal fontconfig so Roboto/DejaVu platform-font probes match apt packages. -->
<fontconfig>
  <dir>/usr/share/fonts/truetype/roboto/unhinted/RobotoTTF</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir>/tmp/milksha-e2e-fontconfig-cache</cachedir>
</fontconfig>

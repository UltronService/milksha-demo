# Board PR preview via Firebase Hosting preview channel (milksha-qms-dev).
# Does not deploy to the live Hosting channel or GitHub Pages production.
name: Deploy board PR preview (Firebase Hosting)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: firebase-board-pr-preview-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.channel.outputs.preview_url }}
    env:
      PREVIEW_SITE: milksha-demo-board-preview
      PR_NUMBER: ${{ github.event.pull_request.number || '122' }}
    steps:
      - name: Checkout pull request head
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Prepare static site
        if: github.event.action != 'closed'
        env:
          MILKSHA_FIREBASE_API_KEY: ${{ secrets.MILKSHA_FIREBASE_API_KEY }}
          MILKSHA_DEV_POS_SIGN_SECRET: ${{ secrets.MILKSHA_DEV_POS_SIGN_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude 'tests' \
            --exclude 'tools' \
            --exclude 'node_modules' \
            ./ _site/
          node scripts/inject-firebase-config.mjs _site/config/firebase.js

      - name: Ensure Firebase Hosting preview site exists
        if: github.event.action != 'closed'
        env:
          FIREBASE_TOKEN: ${{ secrets.MILKSHA_QMS_DEV_FIREBASE_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          MILKSHA_QMS_DEV_FIREBASE_SA: ${{ secrets.MILKSHA_QMS_DEV_FIREBASE_SA }}
        run: |
          set -euo pipefail
          if [ -z "$MILKSHA_QMS_DEV_FIREBASE_SA" ] && [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing MILKSHA_QMS_DEV_FIREBASE_SA or MILKSHA_QMS_DEV_FIREBASE_TOKEN"
            exit 1
          fi
          if [ -n "$MILKSHA_QMS_DEV_FIREBASE_SA" ]; then
            echo "$MILKSHA_QMS_DEV_FIREBASE_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          fi
          npx firebase-tools hosting:sites:list --project milksha-qms-dev --json > sites.json
          node -e "
            const fs = require('fs');
            const site = process.env.PREVIEW_SITE;
            const data = JSON.parse(fs.readFileSync('sites.json','utf8'));
            const list = data.result && data.result.sites ? data.result.sites : [];
            if (!list.some((s) => s.name && s.name.endsWith('/' + site))) {
              console.log('Creating hosting site', site);
            } else {
              console.log('Hosting site already exists:', site);
            }
          "
          npx firebase-tools hosting:sites:create "$PREVIEW_SITE" --project milksha-qms-dev --non-interactive 2>/dev/null || true

      - name: Deploy preview channel
        if: github.event.action != 'closed'
        id: channel
        env:
          FIREBASE_TOKEN: ${{ secrets.MILKSHA_QMS_DEV_FIREBASE_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          MILKSHA_QMS_DEV_FIREBASE_SA: ${{ secrets.MILKSHA_QMS_DEV_FIREBASE_SA }}
        run: |
          set -euo pipefail
          if [ -n "$MILKSHA_QMS_DEV_FIREBASE_SA" ]; then
            echo "$MILKSHA_QMS_DEV_FIREBASE_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          fi
          channel="pr${PR_NUMBER}"
          npx firebase-tools hosting:channel:deploy "$channel" \
            --project milksha-qms-dev \
            --only "hosting:${PREVIEW_SITE}" \
            --expires 30d \
            --non-interactive | tee channel-deploy.log
          url=$(grep -Eo 'https://[^ ]+' channel-deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "Could not parse preview URL from firebase deploy output"
            exit 1
          fi
          echo "preview_url=${url%/}/" >> "$GITHUB_OUTPUT"

      - name: Verify build stamp in preview
        if: github.event.action != 'closed'
        env:
          PREVIEW_URL: ${{ steps.channel.outputs.preview_url }}
        run: |
          set -euo pipefail
          curl -fsSL "${PREVIEW_URL}js/milksha-asset-version.js" | grep -q "MILKSHA_BOARD_WEB_BUILD_LABEL"

  comment:
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && github.event.action != 'closed'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URLs on PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '122' }}
          PREVIEW_URL: ${{ needs.deploy.outputs.preview_url || '' }}
        with:
          script: |
            const marker = '<!-- milksha-board-pr-preview -->';
            const base = process.env.PREVIEW_URL || '';
            const board = `${base}?mode=cloud&store=zz-qa-store-a&motion=on&demo=1`;
            const controller = `${base}controller/?mode=cloud&store=zz-qa-store-a`;
            const body = `${marker}\n## 看板試作預覽（PM）\n\n| | 連結 |\n|---|---|\n| **看板** | ${board} |\n| **控制端** | ${controller} |\n\n- Firebase Hosting **預覽頻道**（不動 live、不併主線）。\n- 測試店：\`zz-qa-store-a\`。\n- 左下角應顯示試作版本號。`;
            const issue_number = Number(process.env.PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

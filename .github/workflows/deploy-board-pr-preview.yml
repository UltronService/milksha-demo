# PM board preview: /pr-preview/pr-<N>/ on GitHub Pages (main @ site root + trial branch under pr-preview).
# Triggered by push to cursor/** or manual dispatch so GITHUB_REF is the trial branch (not refs/pull/*/merge).
name: Deploy board PR preview (GitHub Pages)

on:
  push:
    branches:
      - 'cursor/**'
  workflow_dispatch:
    inputs:
      preview_pr_number:
        description: 'PR number for /pr-preview/pr-N/ (manual dispatch only; otherwise from commit)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: github-pages-milksha-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      preview_base: ${{ steps.urls.outputs.preview_base }}
      preview_pr_number: ${{ steps.prnum.outputs.number }}
      preview_build_label: ${{ steps.stamp.outputs.build_label }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Show deploy ref (must be cursor/* branch, not pull merge ref)
        run: |
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          echo "GITHUB_SHA=${GITHUB_SHA}"

      - name: Checkout trial branch (preview content + CI scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pr-tree

      - name: Resolve preview PR number
        id: prnum
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PR: ${{ github.event.inputs.preview_pr_number || '' }}
        run: |
          set -euo pipefail
          associated="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].number' 2>/dev/null | tr '\n' ' ' || true)"
          head_num="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number' 2>/dev/null || true)"
          export ASSOCIATED_PR_NUMBERS="$associated"
          export HEAD_PR_NUMBER="$head_num"
          num="$(node pr-tree/scripts/resolve-board-pr-preview-pr-number.mjs)"
          echo "number=$num" >> "$GITHUB_OUTPUT"
          echo "Using pr-preview/pr-${num}/"

      - name: Checkout main (production tree at site root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-tree

      - name: Prepare production site root
        env:
          MILKSHA_FIREBASE_API_KEY: ${{ secrets.MILKSHA_FIREBASE_API_KEY }}
          MILKSHA_DEV_POS_SIGN_SECRET: ${{ secrets.MILKSHA_DEV_POS_SIGN_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p deploy-site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude 'tests' \
            --exclude 'tools' \
            --exclude 'node_modules' \
            main-tree/ deploy-site/
          node main-tree/scripts/inject-firebase-config.mjs deploy-site/config/firebase.js
          touch deploy-site/.nojekyll

      - name: Add PR preview subtree
        env:
          MILKSHA_FIREBASE_API_KEY: ${{ secrets.MILKSHA_FIREBASE_API_KEY }}
          MILKSHA_DEV_POS_SIGN_SECRET: ${{ secrets.MILKSHA_DEV_POS_SIGN_SECRET }}
          PR_NUMBER: ${{ steps.prnum.outputs.number }}
        run: |
          set -euo pipefail
          preview_dir="deploy-site/pr-preview/pr-${PR_NUMBER}"
          mkdir -p "$preview_dir"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude 'tests' \
            --exclude 'tools' \
            --exclude 'node_modules' \
            pr-tree/ "$preview_dir/"
          node main-tree/scripts/inject-firebase-config.mjs "$preview_dir/config/firebase.js"

      - name: Preserve other PR preview folders from live Pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.prnum.outputs.number }}
        run: |
          set -euo pipefail
          node pr-tree/scripts/preserve-pages-pr-preview.mjs deploy-site "$PR_NUMBER"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preview URLs
        id: urls
        env:
          PR_NUMBER: ${{ steps.prnum.outputs.number }}
        run: |
          set -euo pipefail
          base="$(node -e "import { buildPreviewBaseUrl } from './pr-tree/scripts/lib/board-pr-preview-deploy.mjs'; console.log(buildPreviewBaseUrl(process.env.PR_NUMBER));")"
          echo "preview_base=${base}" >> "$GITHUB_OUTPUT"

      - name: Read expected build stamp from trial branch
        id: stamp
        run: |
          set -euo pipefail
          label="$(node -e "
            import { readFileSync } from 'node:fs';
            import { parseMilkshaAssetVersionJs } from './pr-tree/scripts/lib/board-pr-preview-deploy.mjs';
            const t = readFileSync('pr-tree/js/milksha-asset-version.js','utf8');
            const p = parseMilkshaAssetVersionJs(t);
            if (!p.boardWebBuildLabel) process.exit(1);
            console.log(p.boardWebBuildLabel);
          ")"
          echo "build_label=${label}" >> "$GITHUB_OUTPUT"

      - name: Verify build stamp in preview static file
        env:
          PREVIEW_BASE: ${{ steps.urls.outputs.preview_base }}
        run: |
          set -euo pipefail
          node pr-tree/scripts/verify-board-pr-preview-live.mjs pr-tree "$PREVIEW_BASE"

  comment:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URLs on PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.deploy.outputs.preview_pr_number }}
          PREVIEW_BASE: ${{ needs.deploy.outputs.preview_base }}
          BUILD_LABEL: ${{ needs.deploy.outputs.preview_build_label }}
        with:
          script: |
            const marker = '<!-- milksha-board-pr-preview -->';
            const base = process.env.PREVIEW_BASE;
            const prNum = process.env.PR_NUMBER;
            const buildLabel = process.env.BUILD_LABEL || '(see js/milksha-asset-version.js)';
            const board = `${base}?mode=cloud&store=zz-qa-store-a&motion=on&demo=1`;
            const controller = `${base}controller/?mode=cloud&store=zz-qa-store-a`;
            const body = `${marker}\n## 看板試作預覽（PM）\n\n| | 連結 |\n|---|---|\n| **看板** | ${board} |\n| **控制端** | ${controller} |\n\n- 路徑：\`pr-preview/pr-${prNum}/\`；正式站 [根目錄](https://ultronservice.github.io/milksha-demo/) 不變。\n- 測試店：\`zz-qa-store-a\`。\n- 左下角版本號應為 \`${buildLabel}\`。`;
            const issue_number = Number(prNum);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

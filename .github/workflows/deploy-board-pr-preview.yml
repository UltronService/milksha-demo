# PR board preview under /pr-preview/pr-<N>/ (does not replace production root on purpose:
# artifact is main @ root + PR files under pr-preview/). Uses same github.io origin as live Pages.
name: Deploy board PR preview (GitHub Pages)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages-board-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (production tree at site root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-tree

      - name: Prepare production site root
        env:
          MILKSHA_FIREBASE_API_KEY: ${{ secrets.MILKSHA_FIREBASE_API_KEY }}
          MILKSHA_DEV_POS_SIGN_SECRET: ${{ secrets.MILKSHA_DEV_POS_SIGN_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p deploy-site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude 'tests' \
            --exclude 'tools' \
            --exclude 'node_modules' \
            main-tree/ deploy-site/
          node main-tree/scripts/inject-firebase-config.mjs deploy-site/config/firebase.js
          touch deploy-site/.nojekyll

      - name: Checkout pull request head
        if: github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-tree

      - name: Add PR preview subtree
        if: github.event.action != 'closed'
        env:
          MILKSHA_FIREBASE_API_KEY: ${{ secrets.MILKSHA_FIREBASE_API_KEY }}
          MILKSHA_DEV_POS_SIGN_SECRET: ${{ secrets.MILKSHA_DEV_POS_SIGN_SECRET }}
        run: |
          set -euo pipefail
          preview_dir="deploy-site/pr-preview/pr-${{ github.event.pull_request.number }}"
          mkdir -p "$preview_dir"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude 'tests' \
            --exclude 'tools' \
            --exclude 'node_modules' \
            pr-tree/ "$preview_dir/"
          node main-tree/scripts/inject-firebase-config.mjs "$preview_dir/config/firebase.js"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  comment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URLs on PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_CLOSED: ${{ github.event.action == 'closed' }}
        with:
          script: |
            const marker = '<!-- milksha-board-pr-preview -->';
            const n = process.env.PR_NUMBER;
            const base = `https://ultronservice.github.io/milksha-demo/pr-preview/pr-${n}/`;
            const board = `${base}?mode=cloud&store=zz-qa-store-a&motion=on&demo=1`;
            const controller = `${base}controller/?mode=cloud&store=zz-qa-store-a`;
            const body = process.env.IS_CLOSED === 'true'
              ? `${marker}\n## 看板試作預覽已移除\n\nPR 已關閉，預覽路徑不再更新。`
              : `${marker}\n## 看板試作預覽（PM）\n\n| | 連結 |\n|---|---|\n| **看板** | ${board} |\n| **控制端** | ${controller} |\n\n- 僅供試作；正式站仍是 [根目錄](https://ultronservice.github.io/milksha-demo/)。\n- 測試店：\`zz-qa-store-a\`。\n- 左下角應顯示試作版本號（例如 \`10/24 11:50\`）。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

name: CI Nightly (live cloud)

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  e2e-live-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: live-cloud-zz-qa-ci-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install e2e platform fonts (Roboto, DejaVu)
        run: sudo apt-get update && sudo apt-get install -y fonts-roboto fonts-dejavu-core && fc-cache -f
      - name: E2E live cloud (one run at a time globally)
        run: >-
          npx playwright test
          tests/e2e/controller-source-live-cloud.spec.mjs
          tests/e2e/board-animation-live-cloud.spec.mjs
          tests/e2e/controller-simulation-live-cloud.spec.mjs
          tests/e2e/home-board-auto-pair-live-cloud.spec.mjs
        env:
          LIVE_CLOUD_STORE_ID: zz-qa-ci-store
          MILKSHA_E2E_ARTIFACTS: ${{ runner.temp }}/milksha-e2e-artifacts
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/e2e/fonts/fontconfig-e2e.conf

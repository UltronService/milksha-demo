name: CI

# PR updates: pull_request only (push is limited to main, so no duplicate runs per PR push).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Install e2e platform fonts (Roboto, DejaVu)
        run: sudo apt-get update && sudo apt-get install -y fonts-roboto fonts-dejavu-core && fc-cache -f
      - name: E2E (excludes zz-qa-ci-store live cloud specs)
        run: |
          mapfile -d '' specs < <(find tests/e2e -name '*.spec.mjs' ! -name '*-live-cloud.spec.mjs' -print0)
          npx playwright test "${specs[@]}"
        env:
          MILKSHA_E2E_ARTIFACTS: ${{ runner.temp }}/milksha-e2e-artifacts
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/e2e/fonts/fontconfig-e2e.conf

  e2e-live-cloud:
    runs-on: ubuntu-latest
    concurrency:
      group: live-cloud-zz-qa-ci-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install e2e platform fonts (Roboto, DejaVu)
        run: sudo apt-get update && sudo apt-get install -y fonts-roboto fonts-dejavu-core && fc-cache -f
      - name: E2E live cloud (one run at a time globally)
        run: >-
          npx playwright test
          tests/e2e/board-animation-live-cloud.spec.mjs
          tests/e2e/controller-simulation-live-cloud.spec.mjs
        env:
          LIVE_CLOUD_STORE_ID: zz-qa-ci-store
          MILKSHA_E2E_ARTIFACTS: ${{ runner.temp }}/milksha-e2e-artifacts
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/e2e/fonts/fontconfig-e2e.conf
